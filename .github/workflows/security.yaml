name: Security Testing

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]

jobs:
  sast:
    uses: p2p-org/security-workflows/.github/workflows/sast.yaml@d960034593cc6ba94ce59cf7e87b25821195f891 # main
    secrets: inherit
  sca:
    uses: p2p-org/security-workflows/.github/workflows/sca.yaml@d960034593cc6ba94ce59cf7e87b25821195f891 # main
    secrets: inherit
  docker-scan:
    uses: p2p-org/security-workflows/.github/workflows/docker-scan.yaml@d960034593cc6ba94ce59cf7e87b25821195f891 # main
    secrets: inherit
    with:
      image_name: ${{ github.repository }}
